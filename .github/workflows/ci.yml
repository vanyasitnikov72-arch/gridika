name: Check (dev and pull requests)

# Everything main's deploy checks, without publishing. A pull request dev → main can only be
# merged once this is green (turn on "Require status checks" in the branch protection for main).
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (exact versions from pnpm-lock.yaml)
        run: pnpm install --frozen-lockfile

      - name: Release guard — keys, products, fingerprints, link format
        run: pnpm check:release

      - name: Build
        run: pnpm build

      # the built site, to look at before merging: Actions → this run → Artifacts → unzip → open with any static server
      - uses: actions/upload-artifact@v4
        with:
          name: gridika-site-${{ github.sha }}
          path: ./apps/fx/dist
          retention-days: 14
