<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#19C37D" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#122920" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0A1611" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142B22"/>
      <stop offset="100%" stop-color="#08140F"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full-bleed background (works for both circular and square avatar croppers) -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <circle cx="256" cy="250" r="220" fill="url(#glow)"/>

  <!-- Centered Isometric 3D Cube Logo (Gridika) -->
  <g transform="translate(256, 256) scale(8.8) translate(-16, -16.5)">
    <!-- Wireframe Cube Faces & Edges -->
    <path d="M16 3.5 L28.5 10 L16 16.5 L3.5 10 Z" fill="#132A22" stroke="#19C37D" stroke-width="1.3" stroke-linejoin="round" />
    <path d="M3.5 10 L16 16.5 V29.5 L3.5 23 Z" fill="#0C1B15" stroke="#19C37D" stroke-width="1.3" stroke-linejoin="round" />
    <path d="M28.5 10 L16 16.5 V29.5 L28.5 23 Z" fill="#081410" stroke="#19C37D" stroke-width="1.3" stroke-linejoin="round" />

    <!-- Top Face: Diamond QR Finder + 2 Flanking Dots -->
    <path d="M16 6.5 L20.5 9.2 L16 12 L11.5 9.2 Z" stroke="#5BE3A6" stroke-width="1.1" fill="#19C37D" fill-opacity="0.32" stroke-linejoin="round" />
    <circle cx="16" cy="9.2" r="1.15" fill="#8BF0C2" />
    <circle cx="10" cy="8" r="0.95" fill="#19C37D" />
    <circle cx="22" cy="8" r="0.95" fill="#19C37D" />

    <!-- Left Face: Square QR Finder + Top Dot -->
    <path d="M6.5 17.5 L12.5 20.5 V25.5 L6.5 22.5 Z" stroke="#5BE3A6" stroke-width="1.1" fill="#19C37D" fill-opacity="0.32" stroke-linejoin="round" />
    <circle cx="9.5" cy="21.5" r="1.15" fill="#8BF0C2" />
    <circle cx="9.5" cy="14.8" r="1.0" fill="#19C37D" />

    <!-- Right Face: Square QR Finder + Top Dot -->
    <path d="M25.5 17.5 L19.5 20.5 V25.5 L25.5 22.5 Z" stroke="#5BE3A6" stroke-width="1.1" fill="#19C37D" fill-opacity="0.32" stroke-linejoin="round" />
    <circle cx="22.5" cy="21.5" r="1.15" fill="#8BF0C2" />
    <circle cx="22.5" cy="14.8" r="1.0" fill="#19C37D" />

    <!-- Center Front Seam: Glowing Emerald Dots -->
    <circle cx="16" cy="16.5" r="1.4" fill="#8BF0C2" filter="url(#softGlow)"/>
    <circle cx="16" cy="19.7" r="1.0" fill="#19C37D" />
    <circle cx="16" cy="23.0" r="1.2" fill="#8BF0C2" />
    <circle cx="16" cy="26.2" r="1.0" fill="#19C37D" />
    <circle cx="16" cy="29.5" r="1.2" fill="#8BF0C2" />
  </g>
</svg>
